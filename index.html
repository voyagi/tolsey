<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tolsey</title>
    <meta name="description" content="A food safety log for small restaurant kitchens that you fill in by voice." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tolsey.taranity.com/" />
    <meta property="og:title" content="Tolsey: a food safety log that won’t take “fine”" />
    <meta
      property="og:description"
      content="A cook in gloves says “the walk-in reads 38” and Tolsey logs it, judged against its food safety rule. Say “reach-in two is fine” and it asks for the number. An MCP server for Alexa+."
    />
    <meta property="og:image" content="https://tolsey.taranity.com/card.png" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />
    <meta
      property="og:image:alt"
      content="Tolsey’s card. Cook AB says “the walk-in reads 38” and it lands as Walk-in, 38°F, in range, against a rule of at most 41°F. Below it, “reach-in two is fine” needs a number."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // The one owner of the theme choice: it runs before first paint, and the switch only dispatches a tolsey-theme
      // event here. The page's CSP allows this script by the hash of its exact text, so any edit, whitespace included,
      // needs the CSP's hash changed with it.
      (function () {
        const KEY = 'tolsey-theme';
        const CHOICES = ['light', 'dark', 'device'];
        const root = document.documentElement;
        const osDark = window.matchMedia('(prefers-color-scheme: dark)');
        let choice = 'device';
        try {
          const stored = localStorage.getItem(KEY);
          if (CHOICES.includes(stored)) choice = stored;
        } catch {
          // Storage blocked: Device.
        }
        const asked = new URLSearchParams(location.search).get('theme');
        if (CHOICES.includes(asked)) choice = asked;
        function apply() {
          root.setAttribute('data-theme', choice === 'device' ? (osDark.matches ? 'dark' : 'light') : choice);
          root.setAttribute('data-theme-choice', choice);
        }
        apply();
        osDark.addEventListener('change', function () {
          if (choice === 'device') apply();
        });
        document.addEventListener('tolsey-theme', function (event) {
          if (!CHOICES.includes(event.detail)) return;
          choice = event.detail;
          try {
            localStorage.setItem(KEY, choice);
          } catch {
            // Storage blocked: the choice still holds for this page view.
          }
          apply();
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
