# CI floor for the repository gates.
# Runs the SAME `npm run gate` scripts as the local pre-commit hook = one source of truth, no drift.
# Lean on purpose (PR + default-branch push only): public repos get unlimited Actions minutes, private
# repos are metered, so do not add a schedule here.
name: gates
on:
  pull_request:
  push:
    branches: [main, master]
# Least privilege: `npm ci` executes third-party postinstall scripts, so the job's GITHUB_TOKEN
# must not carry write scopes. Nothing in this workflow writes to the repo.
permissions:
  contents: read
# One run per ref: rapid PR pushes cancel their stale runs (metered minutes on private repos);
# default-branch runs are never cancelled so main always gets a complete verdict.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned: a tag is
      # mutable, a commit SHA is not. Trailing comment names the tag the SHA was verified against
      # (git ls-remote) so bumps stay reviewable. Update SHAs deliberately, never back to bare tags.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # align with the product's .nvmrc / package.json engines.node; if it has a .nvmrc,
          # prefer `node-version-file: '.nvmrc'` so CI and local never drift.
          node-version: 22
          cache: npm
      # Swap `npm ci` + the `npm run` calls below for the product's package manager (pnpm/bun/yarn)
      # if it does not use npm - this file hardcodes npm.
      - run: npm ci
      # Build first so the frontend size-limit gate has a bundle to measure. `--if-present` makes this
      # a no-op on backend/CLI products with no build script (without a build, size-limit errors "no
      # files found" and the gate fails for the wrong reason).
      - run: npm run build --if-present
      # Each gate is a FLOOR: green = no known violation, never "good". Taste/craft is NOT gated here
      # (that belongs to code review). Do not "make the gate pass" by suppressing it.
      #
      # check-env-example.mjs runs INSIDE this chain (as `gate:env`) and deliberately has no step of
      # its own: it reads tracked files and the index, so unlike the client-secret gate below it
      # needs no build and is equally correct in the pre-commit hook. If it is missing from the
      # chain the fix is to add `gate:env` to the `gate` script, never to add a step here, or the
      # hook and CI stop running the same thing and that drift is what this file exists to prevent.
      - run: npm run gate
      # `gate` never runs the test suite, and this is the only workflow, so the tests get their own
      # step or a broken /mcp endpoint still leaves pull-request CI green.
      - run: npm test
      # Client-secret gate, as its OWN step rather than inside `npm run gate`. It needs a BUILT
      # bundle, and `gate` also runs in the pre-commit hook where none exists - there it would
      # correctly report UNKNOWN (exit 2) and fail every commit, so it would be deleted within a
      # day. Here a build always precedes it (the step above). This is the mechanical wiring: a
      # prompt line telling a model to run the gate is the thing the gate itself argues against.
      # If this exits 2 saying no bundle was found, the fix is almost never to delete the step. The
      # gate auto-detects the common layouts, and a monorepo (packages/web/dist) or a custom outDir
      # is found by NO fixed list, so PASS THE DIRECTORY: `node scripts/check-client-secrets.mjs
      # packages/web/dist`. It accepts several. Delete this step ONLY on a product that genuinely
      # ships no client bundle at all (a CLI, a pure backend) - a Next.js app or a monorepo package
      # HAS one, and deleting the gate there removes it from exactly the products it protects.
      - run: node scripts/check-client-secrets.mjs
      # If the product has no separate test/lint workflow, swap the step above for
      # `npm run verify:ship` (types -> FULL tests -> whole-repo lint -> gate) so CI enforces
      # the same full surface the local ship step verifies. With a separate test workflow,
      # keep `npm run gate` here to avoid running the suite twice.
      #
      # SECURITY FLOOR (trivy), on DEFAULT-BRANCH PUSHES ONLY. Not on pull_request on purpose:
      # a frozen repo's Dependabot PRs would print its unpatched CVEs into public CI logs while
      # nobody may merge the fix. Push-only keeps the verdict on what actually landed.
      # The action runs with exit-code 0 and a JSON report; the VERDICT is the jq step below,
      # which fails on HIGH/CRITICAL and fails LOUDLY on an empty or unparsable report - a scan
      # that produced nothing must never read as a scan that found nothing.
      #
      # DEV DEPENDENCIES ARE SCANNED, and the verdict refuses a scan that listed too few packages.
      # `trivy fs` leaves npm dev dependencies out unless told otherwise: without the flag it
      # listed 19 of the 536 packages this lockfile locks (trivy 0.74.0, 2026-10-03). The action
      # has no input for the flag, and its README at the pinned commit says such flags go in as
      # TRIVY_* environment variables. `list-all-pkgs` puts every scanned package in the report,
      # which is what the floor counts. `version` pins trivy itself. The action's default, 0.69.3,
      # reads a lockfile's license field as text, so a lockfile holding a package whose license is
      # a list fails to parse whole. 0.74.0 reads both, and GHSA-69fq-xp46-6x23 names 0.69.4 as
      # the one malicious trivy release. `trivy-config: /dev/null` keeps a trivy.yaml in this
      # repository out of the verdict: trivy reads that file from the folder it runs in, and the
      # action passes on only the inputs that differ from its defaults, so a `severity: [LOW]`
      # there would turn this verdict green over HIGH findings. .trivyignore still applies, one
      # advisory per line.
      - if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          # Two DB mirrors: ghcr alone rate-limits cold caches into false failures.
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          list-all-pkgs: 'true'
          format: json
          output: trivy-vulns.json
          exit-code: '0'
          cache: 'true'
          version: v0.74.0
          trivy-config: /dev/null
      - if: github.event_name == 'push'
        name: fail on HIGH/CRITICAL vulnerabilities
        run: |
          test -s trivy-vulns.json || { echo 'trivy produced no report - refusing to read that as clean'; exit 1; }
          # The test below = exactly one JSON object, nothing more. A report holding two documents
          # makes each count below print two numbers, and bash skips a test whose arithmetic fails
          # together with its `||` handler, so the step would pass. NOT `jq -e '.Results'`: trivy
          # omits the Results key entirely on a scan with no targets (measured on 0.74.0, a
          # no-lockfile directory), and whether the scan saw the packages is the coverage floor's
          # question, answered below by a message that says so rather than by a parse failure.
          jq -se 'length == 1 and (.[0] | type) == "object"' trivy-vulns.json > /dev/null || { echo 'trivy report did not parse as one JSON object - refusing to read that as clean'; exit 1; }
          # COVERAGE FLOOR: the report must list at least 9 in 10 of the packages package-lock.json
          # locks, counted the way trivy counts them (one per name and version, the name taken from
          # the entry's own name field where npm wrote one, as it does for an alias, links left out),
          # or a scan that saw part of the tree reads as clean. On pnpm, yarn or bun, count that
          # lockfile here and in the census step below instead.
          # Why 9 in 10: trivy's own listing equals this count here (536 of 536 on 2026-10-03),
          # and the scan without dev dependencies listed 19, so the margin only absorbs the rare
          # link shapes trivy counts its own way.
          locked=$(jq '[.packages // {} | to_entries[] | select(.key != "" and (.value.link | not)) | "\(.value.name // (.key | sub("^.*node_modules/"; "")))@\(.value.version)"] | unique | length' package-lock.json) || { echo 'package-lock.json is missing or did not parse - refusing to judge the report. On pnpm, yarn or bun, count that lockfile in this step instead'; exit 1; }
          [ "$locked" -gt 0 ] || { echo 'package-lock.json locks no packages in the form counted here (a v1 lockfile has none) - refusing to judge the report'; exit 1; }
          scanned=$(jq '[.Results[]? | select(.Class == "lang-pkgs" and .Target == "package-lock.json") | .Packages[]?] | length' trivy-vulns.json)
          echo "packages listed: $scanned of $locked locked in package-lock.json"
          [ $((scanned * 10)) -ge $((locked * 9)) ] || { echo 'trivy listed too few of the locked packages - refusing to read that as clean. Causes seen so far: TRIVY_INCLUDE_DEV_DEPS missing from the scan step, or a trivy that cannot parse the lockfile (0.69.3 on a license list)'; exit 1; }
          count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length' trivy-vulns.json)
          echo "HIGH/CRITICAL vulnerabilities: $count"
          if [ "$count" -gt 0 ]; then
            jq -r '.Results[]? | .Target as $t | (.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL") | "\($t): \(.PkgName) \(.InstalledVersion) \(.VulnerabilityID) (\(.Severity))")' trivy-vulns.json
            exit 1
          fi
      # LICENSE CENSUS, report-only: copyleft or UNKNOWN licenses are a decision, not an
      # automatic failure, so no license fails this step - but the artifact must EXIST, parse and
      # cover the lockfile, or the census silently stopped running (or saw part of the tree) and
      # kept reading as "no findings". Dev dependencies are in and any trivy.yaml is out, for the
      # reasons given above. Its steps run on !cancelled() rather than the default success(), so
      # a failing vulnerability verdict, which can stay red until an upstream fix ships, does not
      # switch the census off.
      - if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          list-all-pkgs: 'true'
          format: json
          output: trivy-licenses.json
          exit-code: '0'
          cache: 'true'
          version: v0.74.0
          trivy-config: /dev/null
      - if: ${{ !cancelled() && github.event_name == 'push' }}
        name: assert the license census ran
        run: |
          test -s trivy-licenses.json || { echo 'license census produced no report'; exit 1; }
          jq -se 'length == 1 and (.[0] | type) == "object"' trivy-licenses.json > /dev/null || { echo 'license census report did not parse as one JSON object'; exit 1; }
          # COVERAGE FLOOR, the same five lines as in the vulnerability verdict above.
          locked=$(jq '[.packages // {} | to_entries[] | select(.key != "" and (.value.link | not)) | "\(.value.name // (.key | sub("^.*node_modules/"; "")))@\(.value.version)"] | unique | length' package-lock.json) || { echo 'package-lock.json is missing or did not parse - refusing to judge the report. On pnpm, yarn or bun, count that lockfile in this step instead'; exit 1; }
          [ "$locked" -gt 0 ] || { echo 'package-lock.json locks no packages in the form counted here (a v1 lockfile has none) - refusing to judge the report'; exit 1; }
          scanned=$(jq '[.Results[]? | select(.Class == "lang-pkgs" and .Target == "package-lock.json") | .Packages[]?] | length' trivy-licenses.json)
          echo "packages listed: $scanned of $locked locked in package-lock.json"
          [ $((scanned * 10)) -ge $((locked * 9)) ] || { echo 'trivy listed too few of the locked packages - refusing to read that as clean. Causes seen so far: TRIVY_INCLUDE_DEV_DEPS missing from the scan step, or a trivy that cannot parse the lockfile (0.69.3 on a license list)'; exit 1; }
      - if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: license-census
          path: trivy-licenses.json
