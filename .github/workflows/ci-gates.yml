# CI floor for the repository gates.
# Runs the SAME `npm run gate` scripts as the local pre-commit hook = one source of truth, no drift.
# Lean on purpose (PR + default-branch push only): public repos get unlimited Actions minutes, private
# repos are metered, so do not add a schedule here.
name: gates
on:
  pull_request:
  push:
    branches: [main, master]
# Least privilege: the install runs with scripts off and only esbuild and workerd are rebuilt, but
# the build and test steps still execute dependency code, so the job's GITHUB_TOKEN must not carry
# write scopes. Nothing in this workflow writes to the repo.
permissions:
  contents: read
# One run per ref: rapid PR pushes cancel their stale runs (metered minutes on private repos);
# default-branch runs are never cancelled so main always gets a complete verdict.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26.04 from 2026-10-19 (rollout ends
    # 2026-11-19): the OS version changes only by an edit here, never under a release in flight.
    # The pin does not freeze the image's installed tools, which GitHub still updates weekly.
    # Dates: https://github.blog/changelog/2026-09-17-ubuntu-26-generally-available-and-latest-migration/
    runs-on: ubuntu-24.04
    steps:
      # SHA-pinned: a tag is
      # mutable, a commit SHA is not. Trailing comment names the tag the SHA was verified against
      # (git ls-remote) so bumps stay reviewable. Update SHAs deliberately, never back to bare tags.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches package.json engines.node. Node 24 bundles npm 11, the first line that reads
          # allowScripts and strict-allow-scripts; Node 22's npm 10 ignores both and would run every
          # install script silently.
          node-version: 24
          cache: npm
      # Scripts off for the whole install (--ignore-scripts also overrides strict-allow-scripts),
      # then only the two reviewed packages that need their install step are rebuilt. Their
      # allowScripts entries pin exact versions, so an esbuild or workerd bump moves both.
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild workerd
      # With scripts off, a NEW package that ships an install script would install quietly and
      # never be reviewed. npm install-scripts ls lists every installed package whose script is
      # not covered by allowScripts; any entry fails the job. An empty or unparsable report, or
      # one without the allowScripts key, fails too: a check that printed nothing is not clean.
      - name: fail on install scripts not covered by allowScripts
        run: |
          report="$RUNNER_TEMP/install-scripts.json"
          npm install-scripts ls --json > "$report"
          test -s "$report" || { echo 'npm install-scripts ls printed nothing - refusing to read that as clean'; exit 1; }
          jq -e . "$report" > /dev/null || { echo 'npm install-scripts ls output did not parse'; exit 1; }
          jq -e '.allowScripts | type == "array"' "$report" > /dev/null || { echo 'npm install-scripts ls output has no allowScripts array'; exit 1; }
          uncovered=$(jq '.allowScripts | length' "$report")
          if [ "$uncovered" -gt 0 ]; then
            echo "packages with install scripts not covered by package.json allowScripts: $uncovered"
            jq '.allowScripts' "$report"
            exit 1
          fi
      # Build first so the frontend size-limit gate has a bundle to measure. `--if-present` makes this
      # a no-op on backend/CLI products with no build script (without a build, size-limit errors "no
      # files found" and the gate fails for the wrong reason).
      - run: npm run build --if-present
      # Each gate is a FLOOR: green = no known violation, never "good". Taste/craft is NOT gated here
      # (that belongs to code review). Do not "make the gate pass" by suppressing it.
      #
      # check-env-example.mjs runs INSIDE this chain (as `gate:env`) and deliberately has no step of
      # its own: it reads tracked files and the index, so unlike the client-secret gate below it
      # needs no build and is equally correct in the pre-commit hook. If it is missing from the
      # chain the fix is to add `gate:env` to the `gate` script, never to add a step here, or the
      # hook and CI stop running the same thing and that drift is what this file exists to prevent.
      - run: npm run gate
      # `gate` never runs the test suite, and this is the only workflow, so the tests get their own
      # step or a broken /mcp endpoint still leaves pull-request CI green.
      - run: npm test
      # Its own step, so a coverage floor that fails reads as coverage and never as a failed test run.
      - run: npm run test:coverage
      # Its own step, because a green npm test can still have skipped or never collected a test file.
      - run: npm run gate:test-count
      # Client-secret gate, as its OWN step rather than inside `npm run gate`. It needs a BUILT
      # bundle, and `gate` also runs in the pre-commit hook where none exists - there it would
      # correctly report UNKNOWN (exit 2) and fail every commit, so it would be deleted within a
      # day. Here a build always precedes it (the step above). This is the mechanical wiring: a
      # prompt line telling a model to run the gate is the thing the gate itself argues against.
      # If this exits 2 saying no bundle was found, the fix is almost never to delete the step. The
      # gate auto-detects the common layouts, and a monorepo (packages/web/dist) or a custom outDir
      # is found by NO fixed list, so PASS THE DIRECTORY: `node scripts/check-client-secrets.mjs
      # packages/web/dist`. It accepts several. Delete this step ONLY on a product that genuinely
      # ships no client bundle at all (a CLI, a pure backend) - a Next.js app or a monorepo package
      # HAS one, and deleting the gate there removes it from exactly the products it protects.
      - run: node scripts/check-client-secrets.mjs
      # If the product has no separate test/lint workflow, swap the step above for
      # `npm run verify:ship` (types -> FULL tests -> whole-repo lint -> gate) so CI enforces
      # the same full surface the local ship step verifies. With a separate test workflow,
      # keep `npm run gate` here to avoid running the suite twice.
      #
      # SECURITY FLOOR (trivy), on default-branch pushes AND on pull requests. This product owns a
      # public endpoint, so a vulnerable dependency must be caught before it merges, not after.
      # Dependabot's own pull requests are excluded: while a repo is frozen nobody may merge the
      # fix, and its bot pull requests would print the unpatched CVEs into public CI logs.
      # No path filter, so a pull request that changes no lockfile is still scanned.
      # Dev dependencies are included (trivy fs drops them by default), and the verdict asserts
      # package-lock.json was actually read, so a scan that skipped the lockfile cannot pass.
      # list-all-pkgs puts every scanned package in the report (the action exports nothing at its
      # own default), which is what lets the verdict also prove the dev dependencies were scanned.
      # The action runs with exit-code 0 and a JSON report; the VERDICT is the jq step below,
      # which fails on HIGH/CRITICAL and fails LOUDLY on an empty or unparsable report - a scan
      # that produced nothing must never read as a scan that found nothing.
      - if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]')
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          # Two DB mirrors: ghcr alone rate-limits cold caches into false failures.
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy-vulns.json
          list-all-pkgs: 'true'
          exit-code: '0'
          cache: 'true'
      - if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]')
        name: fail on HIGH/CRITICAL vulnerabilities
        run: |
          test -s trivy-vulns.json || { echo 'trivy produced no report - refusing to read that as clean'; exit 1; }
          # `jq -e .` = valid JSON, nothing more. NOT `jq -e '.Results'`: trivy omits the Results
          # key entirely on a scan with no targets (measured on 0.74.0, a no-lockfile directory),
          # and -e treats that null as failure. This repo has a lockfile, so the target assertion
          # after it is what proves the scan read it.
          jq -e . trivy-vulns.json > /dev/null || { echo 'trivy report did not parse - refusing to read that as clean'; exit 1; }
          jq -e '[.Results[]?.Target] | any(. == "package-lock.json")' trivy-vulns.json > /dev/null || { echo 'trivy did not scan package-lock.json'; exit 1; }
          # A scan without the dev dependencies still reads package-lock.json and still counts 0
          # (measured on trivy 0.74.0: 19 packages without them, 554 with), so a dev package must be listed.
          jq -e '[.Results[]? | select(.Target == "package-lock.json") | .Packages[]? | select(.Dev == true)] | length > 0' trivy-vulns.json > /dev/null || { echo 'trivy listed no dev dependency - TRIVY_INCLUDE_DEV_DEPS did not reach the scan'; exit 1; }
          count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length' trivy-vulns.json)
          echo "HIGH/CRITICAL vulnerabilities: $count"
          if [ "$count" -gt 0 ]; then
            jq -r '.Results[]? | .Target as $t | (.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL") | "\($t): \(.PkgName) \(.InstalledVersion) \(.VulnerabilityID) (\(.Severity))")' trivy-vulns.json
            exit 1
          fi
      # LICENSE CENSUS, report-only: copyleft or UNKNOWN licenses are a decision, not an
      # automatic failure, so this never gates - but the artifact must EXIST and be non-empty,
      # or the census silently stopped running and kept reading as "no findings".
      - if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          format: json
          output: trivy-licenses.json
          exit-code: '0'
          cache: 'true'
      - if: github.event_name == 'push'
        name: assert the license census ran
        run: |
          test -s trivy-licenses.json || { echo 'license census produced no report'; exit 1; }
          jq -e . trivy-licenses.json > /dev/null || { echo 'license census report did not parse'; exit 1; }
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: license-census
          path: trivy-licenses.json
